# Visual showcase smoke: case waves, 2 steps. Step 1 runs the prompt-only root W0 (arm B) and one model call writes
# W1's ADAPTER.md; step 2 runs W1 (arm C, ADAPTER.md in the agent's system prompt) and writes W2.
data:
  tasks: ../../tasks/visual_showcase/tasks.jsonl
  train: ../../tasks/visual_showcase/splits/waves.txt
  test: ../../tasks/visual_showcase/splits/waves-eval.txt
  step_size: 1
task_info: ../../tasks/visual_showcase/task-info/waves/
pipeline:
  run: ../../tasks/visual_showcase/pipeline.py:run
  concurrency: 1
judge:
  path: ../../tasks/visual_showcase/judge.py
template: prompt-only@1.0
evolver:
  name: prompt_only
  params: {max_chars: 6000}           # the whole judge feedback: 5 rubric lines and 12 item lines
llm:
  base_url: https://api.fireworks.ai/inference/v1
  model: accounts/fireworks/models/glm-5p3-flash
  api_key_env: FIREWORKS_API_KEY
  price: {input: 0.15, cached_input: 0.03, output: 0.50}
  extra_body: {reasoning_effort: 4096}  # caps GLM's thinking, as for the agent and the judge
sandbox:
  enabled: true
  network: none                       # prompt_only starts no program; the Trainer itself makes the `llm` call
  env: []
trainer:
  run_name: visual-smoke
  output_dir: runs
  tree_dir: runs/trees/smoke
  epochs: 2
  save_freq: {steps: 1, epochs: 1}
  budget: {usd: 2, hours: 2}
  call_timeout_min: 30
